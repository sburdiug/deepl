[project]
name = "deepl-lab4"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "onnx==1.20.1",
    "onnxruntime==1.24.4",
    "pillow==12.0.0",
    "scikit-learn==1.7.2",
    "torch==2.9.0",
    "torchvision==0.24.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
